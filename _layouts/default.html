<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="icon" href="{{ '/assets/icons/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="icon" href="{{ '/assets/icons/favicon.ico' | relative_url }}" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/icons/favicon-32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/icons/favicon-16.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/icons/apple-touch-icon.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="192x192" href="{{ '/assets/icons/icon-192.png' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a class="site-title-link" href="{{ '/' | relative_url }}">
      <img class="site-icon" src="{{ '/assets/icons/icon-192.png' | relative_url }}" alt="">
      <span class="site-title">{{ site.title }}</span>
    </a>
    <p class="site-subtitle">{{ site.description }}</p>
  </header>
  <main{% if page.layout == 'practica' %} class="main-practica"{% endif %}>
    {{ content }}
  </main>
  <footer class="site-footer">
    <p>{{ site.title }} · hecho con Jekyll + GitHub Pages</p>
  </footer>
</body>
</html>
