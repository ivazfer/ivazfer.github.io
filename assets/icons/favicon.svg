    <rect x="222" y="370" width="68" height="60" rx="14" fill="#c98f69"/>
    <path d="M40 520 C 60 420, 160 398, 256 398 C 352 398, 452 420, 472 520 Z" fill="#64748b"/>
    <path d="M216 398 Q 256 440 296 398 Z" fill="#c98f69"/>

    <!-- orejas -->
    <circle cx="136" cy="282" r="26" fill="#d9a07a"/>
    <circle cx="376" cy="282" r="26" fill="#d9a07a"/>

    <!-- pelo (parte trasera, rizos) -->
