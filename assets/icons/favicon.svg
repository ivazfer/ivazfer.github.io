      <circle cx="160" cy="185" r="44"/>
      <circle cx="212" cy="140" r="52"/>
      <circle cx="275" cy="128" r="54"/>
      <circle cx="335" cy="150" r="50"/>
      <circle cx="372" cy="200" r="36"/>
      <circle cx="140" cy="225" r="28"/>
    </g>

    <!-- cara (sin perilla) -->
    <ellipse cx="256" cy="275" rx="122" ry="132" fill="#d9a07a"/>

    <!-- flequillo -->
    <path d="M136 235 C 128 165, 185 132, 256 132 C 327 132, 384 165, 376 235 C 352 192, 322 178, 256 182 C 190 178, 160 192, 136 235 Z" fill="#1a1412"/>

