    <path d="M270 216 Q 302 196 336 214" fill="none" stroke="#1a1412" stroke-width="12" stroke-linecap="round"/>

    <!-- gafas estilo "deal with it" con terminal -->
    <rect x="164" y="244" width="86" height="54" rx="10" fill="#0a0a0a"/>
    <rect x="262" y="244" width="86" height="54" rx="10" fill="#0a0a0a"/>
    <rect x="248" y="256" width="16" height="10" fill="#0a0a0a"/>
    <path d="M164 262 L 128 256 M348 262 L 384 256" stroke="#0a0a0a" stroke-width="10" stroke-linecap="round"/>
    <!-- >_ en la lente izquierda -->
    <polyline points="184,258 204,271 184,284" fill="none" stroke="#22c55e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="212" y1="286" x2="234" y2="286" stroke="#22c55e" stroke-width="8" stroke-linecap="round"/>
    <!-- brillo lente derecha -->
    <path d="M290 250 L 316 250 L 300 292 L 274 292 Z" fill="#ffffff" opacity="0.18"/>

    <!-- nariz -->
    <path d="M256 296 Q 244 322 264 324" fill="none" stroke="#a9704d" stroke-width="7" stroke-linecap="round"/>

    <!-- sonrisa pícara -->
    <path d="M204 352 Q 262 392 322 342" fill="none" stroke="#5a2f22" stroke-width="10" stroke-linecap="round"/>
    <path d="M322 342 Q 332 340 336 330" fill="none" stroke="#5a2f22" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- aro verde (guiño al #OpenToWork) -->
  <circle cx="256" cy="256" r="244" fill="none" stroke="#22c55e" stroke-width="14"/>
